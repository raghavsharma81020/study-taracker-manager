<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyHub // Clean Command Center</title>

  <!-- Typography & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --bg-canvas: #090d16;
      --bg-surface: #111827;
      --bg-card: #162032;
      --border-subtle: #22304a;
      --accent-cyan: #38bdf8;
      --accent-emerald: #10b981;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
    }

    * { box-sizing: border-box; }

    body {
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      padding-bottom: 50px;
    }

    .mono { font-family: 'JetBrains Mono', monospace; }

    /* Top Navigation */
    .top-nav {
      background: rgba(17, 24, 39, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle);
      position: sticky;
      top: 0;
      z-index: 999;
    }

    /* Cards */
    .card-panel {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    /* Expandable Menu Drawer */
    .menu-drawer {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      display: none;
      padding: 15px 0;
      margin-bottom: 20px;
    }
    .menu-drawer.open { display: block; }

    /* Inputs & Buttons */
    .hub-input {
      background: var(--bg-canvas);
      border: 1px solid var(--border-subtle);
      color: #fff;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.9rem;
    }
    .hub-input:focus {
      background: var(--bg-canvas);
      border-color: var(--accent-cyan);
      color: #fff;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
      outline: none;
    }

    .btn-action {
      background: var(--accent-cyan);
      color: #07090e;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      transition: background 0.15s;
    }
    .btn-action:hover { background: #0284c7; color: #fff; }

    /* Topic rows */
    .topic-item {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .topic-item.done { opacity: 0.6; text-decoration: line-through; }
  </style>
</head>

<body>

  <!-- ================= CLEAN TOP NAV ================= -->
  <nav class="top-nav py-3 mb-4">
    <div class="container d-flex justify-content-between align-items-center flex-wrap gap-2">
      <div class="d-flex align-items-center gap-2">
        <i class="bi bi-compass text-info fs-4"></i>
        <span class="fw-bold text-white fs-5">StudyHub // Core</span>
      </div>

      <div class="d-flex align-items-center gap-2">
        <span class="badge bg-dark border border-secondary text-light mono px-3 py-2" id="navCountdown">Target Exam</span>
        <button class="btn btn-outline-info btn-sm rounded-pill px-3" onclick="toggleMenuDrawer()">
          <i class="bi bi-list fs-6 me-1"></i> Menu & Tools
        </button>
      </div>
    </div>
  </nav>

  <!-- ================= EXPANDABLE TOOLS MENU DRAWER ================= -->
  <div class="menu-drawer" id="toolsMenuDrawer">
    <div class="container">
      <div class="row g-3 align-items-center">
        <div class="col-md-4">
          <label class="small text-secondary mb-1">TARGET EXAM DATE</label>
          <input type="date" id="drawerTargetDate" class="form-control hub-input" onchange="updateExamTarget()">
        </div>
        <div class="col-md-4">
          <label class="small text-secondary mb-1">SET TIMETABLE / SCHEDULE SLOT</label>
          <div class="input-group">
            <input type="text" id="drawerSlotName" class="form-control hub-input" placeholder="e.g. Physics Problem Solving">
            <button class="btn btn-outline-info btn-sm" onclick="addCustomTimetableSlot()">Add</button>
          </div>
        </div>
        <div class="col-md-4 text-md-end">
          <button class="btn btn-outline-danger btn-sm rounded-pill mt-4" onclick="localStorage.clear(); location.reload();">
            <i class="bi bi-arrow-counterclockwise me-1"></i> Reset Local Data
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="container">

    <!-- ================= TOP STATS ================= -->
    <div class="row g-3 mb-4">
      <div class="col-6 col-md-4">
        <div class="card-panel py-3 mb-0">
          <small class="text-secondary fw-bold text-uppercase" style="font-size: 0.7rem;">Syllabus Progress</small>
          <div class="fs-3 fw-bold text-info mono mt-1" id="statSyllabus">0%</div>
        </div>
      </div>
      <div class="col-6 col-md-4">
        <div class="card-panel py-3 mb-0">
          <small class="text-secondary fw-bold text-uppercase" style="font-size: 0.7rem;">Completed Chapters</small>
          <div class="fs-3 fw-bold text-emerald mono mt-1" style="color: var(--accent-emerald);" id="statCompletedCount">0 / 0</div>
        </div>
      </div>
      <div class="col-12 col-md-4">
        <div class="card-panel py-3 mb-0">
          <small class="text-secondary fw-bold text-uppercase" style="font-size: 0.7rem;">Active Streak</small>
          <div class="fs-3 fw-bold text-warning mono mt-1">1 Day Active</div>
        </div>
      </div>
    </div>

    <!-- ================= MAIN 2-COLUMN LAYOUT ================= -->
    <div class="row g-4">

      <!-- LEFT COLUMN: FOCUS TIMER & CUSTOM TIMETABLE -->
      <div class="col-12 col-lg-5">
        
        <!-- Clean Focus Timer -->
        <div class="card-panel text-center">
          <div class="small text-secondary fw-bold text-uppercase mb-2">Focus Engine</div>
          <div class="display-3 fw-bold text-white mono my-2" id="timerDisplay">25:00</div>

          <div class="d-flex justify-content-center gap-2 mb-3">
            <button class="btn btn-action px-4" id="timerBtn" onclick="toggleTimer()">Start Timer</button>
            <button class="btn btn-outline-secondary px-3" onclick="resetTimer()">Reset</button>
          </div>

          <div class="btn-group w-100 btn-group-sm">
            <button class="btn btn-outline-secondary" onclick="setTimer(25)">25m</button>
            <button class="btn btn-outline-secondary" onclick="setTimer(50)">50m</button>
            <button class="btn btn-outline-secondary" onclick="setTimer(5)">5m Break</button>
          </div>
        </div>

        <!-- Custom Timetable Slots -->
        <div class="card-panel">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h6 class="fw-bold text-white mb-0"><i class="bi bi-clock-history me-2 text-info"></i>Today's Timetable</h6>
            <small class="text-secondary">Custom Schedule</small>
          </div>
          <div id="timetableList">
            <!-- Dynamically populated -->
          </div>
        </div>

      </div>

      <!-- RIGHT COLUMN: CLEAN SYLLABUS CHECKLIST -->
      <div class="col-12 col-lg-7">
        
        <div class="card-panel">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h6 class="fw-bold text-white mb-0"><i class="bi bi-check2-square me-2 text-info"></i>Study Curriculum Checklist</h6>
            <span class="badge bg-dark border border-secondary text-secondary mono" id="totalCountBadge">0 Topics</span>
          </div>

          <!-- Add Topic Bar -->
          <div class="row g-2 mb-3">
            <div class="col-4">
              <input type="text" id="inSubject" class="form-control hub-input" placeholder="Subject">
            </div>
            <div class="col-6">
              <input type="text" id="inChapter" class="form-control hub-input" placeholder="Chapter Name">
            </div>
            <div class="col-2">
              <button class="btn btn-action w-100" onclick="addTopic()">Add</button>
            </div>
          </div>

          <!-- Topics List -->
          <div id="topicsContainer" style="max-height: 440px; overflow-y: auto;"></div>
        </div>

      </div>

    </div>
  </div>

  <!-- ================= SCRIPT ENGINE ================= -->
  <script>
    // Menu Drawer Toggle
    function toggleMenuDrawer() {
      const drawer = document.getElementById('toolsMenuDrawer');
      drawer.classList.toggle('open');
    }

    // State
    let targetDate = localStorage.getItem('sh_target_date') || "2026-10-15";
    let topics = JSON.parse(localStorage.getItem('sh_clean_top') || JSON.stringify([
      { subject: "Physics", chapter: "Mechanics & Kinematics", done: false },
      { subject: "Maths", chapter: "Calculus & Derivatives", done: false },
      { subject: "Chemistry", chapter: "Periodic Table & Bonding", done: false }
    ]));
    let timetable = JSON.parse(localStorage.getItem('sh_clean_slots') || JSON.stringify([
      { name: "Morning Theory Revision", done: false },
      { name: "Afternoon MCQ Practice", done: false },
      { name: "Evening Formula Review", done: false }
    ]));

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('drawerTargetDate').value = targetDate;
      renderCountdown();
      renderTopics();
      renderTimetable();
      updateStats();
    });

    // Countdown
    function updateExamTarget() {
      targetDate = document.getElementById('drawerTargetDate').value;
      localStorage.setItem('sh_target_date', targetDate);
      renderCountdown();
    }

    function renderCountdown() {
      const diff = Math.ceil((new Date(targetDate) - new Date()) / (1000 * 60 * 60 * 24));
      document.getElementById('navCountdown').innerText = diff > 0 ? `${diff} Days Left` : `Exam Day`;
    }

    // Topics
    function renderTopics() {
      const container = document.getElementById('topicsContainer');
      container.innerHTML = '';
      document.getElementById('totalCountBadge').innerText = `${topics.length} Topics`;

      if (topics.length === 0) {
        container.innerHTML = `<small class="text-secondary">No topics added yet.</small>`;
        return;
      }

      topics.forEach((t, i) => {
        const div = document.createElement('div');
        div.className = `topic-item ${t.done ? 'done' : ''}`;
        div.innerHTML = `
          <div class="d-flex align-items-center gap-3">
            <input type="checkbox" class="form-check-input mt-0" ${t.done ? 'checked' : ''} onchange="toggleTopic(${i})">
            <div>
              <span class="fw-semibold text-white">${t.chapter}</span>
              <span class="badge bg-dark border border-secondary text-info ms-2" style="font-size: 0.65rem;">${t.subject}</span>
            </div>
          </div>
          <button class="btn btn-sm text-secondary p-0" onclick="deleteTopic(${i})"><i class="bi bi-x fs-5"></i></button>
        `;
        container.appendChild(div);
      });
      updateStats();
    }

    function addTopic() {
      const sub = document.getElementById('inSubject').value.trim();
      const chap = document.getElementById('inChapter').value.trim();
      if (!chap) return;
      topics.unshift({ subject: sub || "General", chapter: chap, done: false });
      localStorage.setItem('sh_clean_top', JSON.stringify(topics));
      document.getElementById('inChapter').value = '';
      renderTopics();
    }

    function toggleTopic(i) {
      topics[i].done = !topics[i].done;
      localStorage.setItem('sh_clean_top', JSON.stringify(topics));
      renderTopics();
    }

    function deleteTopic(i) {
      topics.splice(i, 1);
      localStorage.setItem('sh_clean_top', JSON.stringify(topics));
      renderTopics();
    }

    function updateStats() {
      const total = topics.length;
      const done = topics.filter(t => t.done).length;
      const pct = total === 0 ? 0 : Math.round((done / total) * 100);
      document.getElementById('statSyllabus').innerText = `${pct}%`;
      document.getElementById('statCompletedCount').innerText = `${done} / ${total}`;
    }

    // Timetable Slots
    function renderTimetable() {
      const list = document.getElementById('timetableList');
      list.innerHTML = '';
      if (timetable.length === 0) {
        list.innerHTML = `<small class="text-secondary">No custom slots added.</small>`;
        return;
      }
      timetable.forEach((slot, i) => {
        list.innerHTML += `
          <div class="d-flex justify-content-between align-items-center p-2 rounded mb-1 bg-dark border border-secondary border-opacity-25 small">
            <div class="d-flex align-items-center gap-2">
              <input type="checkbox" class="form-check-input" ${slot.done ? 'checked' : ''} onchange="toggleSlot(${i})">
              <span class="${slot.done ? 'text-decoration-line-through text-secondary' : 'text-light'}">${slot.name}</span>
            </div>
            <button class="btn btn-sm text-secondary p-0" onclick="deleteSlot(${i})"><i class="bi bi-x"></i></button>
          </div>
        `;
      });
    }

    function addCustomTimetableSlot() {
      const name = document.getElementById('drawerSlotName').value.trim();
      if (!name) return;
      timetable.push({ name, done: false });
      localStorage.setItem('sh_clean_slots', JSON.stringify(timetable));
      document.getElementById('drawerSlotName').value = '';
      renderTimetable();
    }

    function toggleSlot(i) {
      timetable[i].done = !timetable[i].done;
      localStorage.setItem('sh_clean_slots', JSON.stringify(timetable));
      renderTimetable();
    }

    function deleteSlot(i) {
      timetable.splice(i, 1);
      localStorage.setItem('sh_clean_slots', JSON.stringify(timetable));
      renderTimetable();
    }

    // Clean Focus Timer
    let timerRef = null, leftSec = 25 * 60, isRunning = false;
    function updateDisplay() {
      const m = Math.floor(leftSec / 60).toString().padStart(2, '0');
      const s = (leftSec % 60).toString().padStart(2, '0');
      document.getElementById('timerDisplay').innerText = `${m}:${s}`;
    }

    function toggleTimer() {
      const btn = document.getElementById('timerBtn');
      if (isRunning) {
        clearInterval(timerRef);
        isRunning = false;
        btn.innerText = "Start Timer";
      } else {
        isRunning = true;
        btn.innerText = "Pause";
        timerRef = setInterval(() => {
          if (leftSec > 0) {
            leftSec--;
            updateDisplay();
          } else {
            clearInterval(timerRef);
            isRunning = false;
            alert("Timer complete!");
            btn.innerText = "Start Timer";
          }
        }, 1000);
      }
    }

    function resetTimer() {
      clearInterval(timerRef);
      isRunning = false;
      leftSec = 25 * 60;
      updateDisplay();
      document.getElementById('timerBtn').innerText = "Start Timer";
    }

    function setTimer(m) {
      clearInterval(timerRef);
      isRunning = false;
      leftSec = m * 60;
      updateDisplay();
      document.getElementById('timerBtn').innerText = "Start Timer";
    }
  </script>
</body>
</html>
