<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google Search Console Verification Tag -->
<meta name="google-site-verification" content="PASTE_YOUR_COPIED_TAG_HERE" />

<!-- Search Engine Optimization (SEO) -->
<meta name="description" content="Study Tracker & Manager engineered by Raghav Sharma. Gamified Kanban study workspace with AI Mock Exams and Focus Audio." />
<meta name="keywords" content="Raghav Sharma, Study Tracker, Study Manager, AI Study Planner, Pomodoro Focus, Raghav Sharma Study Tracker" />
<meta name="author" content="Raghav Sharma" />
<meta name="robots" content="index, follow" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | StudySync Pro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .auth-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      width: 100%;
      max-width: 420px;
      padding: 32px;
    }
    .form-control {
      background-color: #0f172a;
      border: 1px solid #334155;
      color: #fff;
    }
    .form-control:focus {
      background-color: #0f172a;
      border-color: #6366f1;
      color: #fff;
      box-shadow: 0 0 0 0.25rem rgba(99, 102, 241, 0.25);
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="text-center mb-4">
      <h2 class="fw-bold mb-1">⚡ StudySync <span class="text-primary">Pro</span></h2>
      <p class="text-secondary small">Sign in to your private study workspace</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show small py-2" role="alert">
            {{ message }}
            <button type="button" class="btn-close py-2" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="/login">
      <div class="mb-3">
        <label class="form-label small text-secondary">Username</label>
        <div class="input-group">
          <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-person"></i></span>
          <input type="text" name="username" class="form-control" placeholder="Enter your username" required autofocus>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label small text-secondary">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-lock"></i></span>
          <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100 fw-semibold py-2">Sign In 🚀</button>
    </form>

    <div class="text-center mt-4 border-top border-secondary pt-3">
      <small class="text-secondary">Don't have an account? <a href="/register" class="text-primary text-decoration-none fw-semibold">Sign up here</a></small>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
